<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - Daily Bread</title>

<style>
body { font-family: Georgia; background:#d2b48c; margin:0; }

header {
    background:black;
    color:#f5e6cc;
    text-align:center;
    padding:20px;
}

.container {
    max-width:900px;
    margin:auto;
    padding:20px;
}

.tabs {
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.tabs button {
    background:black;
    color:#f5e6cc;
    padding:10px 20px;
    border:none;
    cursor:pointer;
    border-radius:4px;
}

.tabs button.active {
    background:#a0522d;
}

.tab-content { display:none; }
.tab-content.active { display:block; }

input, textarea, select {
    width:100%;
    margin-bottom:10px;
    padding:8px;
    box-sizing:border-box;
}

button {
    background:black;
    color:#f5e6cc;
    padding:10px 20px;
    border:none;
    cursor:pointer;
    margin-right:5px;
    margin-bottom:10px;
}

button:hover { background:#333; }

.card {
    background:#f5e6cc;
    padding:15px;
    margin-top:10px;
    border-radius:4px;
}

.team-card {
    display: flex;
    gap: 15px;
    align-items: center;
}

.profile-img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    background: #ccc;
    border: 2px solid #8b4513;
}

.profile-preview {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    display: none;
    margin-bottom: 10px;
    border: 2px solid black;
}

hr { margin:20px 0; border:1px solid #8b4513; }

label {
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>Admin Panel</h1>
</header>

<div class="container">

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('devotionals', this)">Devotionals</button>
        <button class="tab-btn" onclick="switchTab('verses', this)">Verses</button>
        <button class="tab-btn" onclick="switchTab('team', this)">Team</button>
        <button class="tab-btn" onclick="switchTab('readingPlans', this)">Reading Plans</button>
    </div>

    <div id="devotionals" class="tab-content active">
        <h2>Devotionals</h2>

        <label>Title</label>
        <input id="title">

        <label>Day</label>
        <select id="day">
            <option>Sunday</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
        </select>

        <label>Scripture</label>
        <input id="scripture">
        <label>Week Theme</label>
        <input id="monthTheme" placeholder="October - Spirits">

        <label>Daily theme</label>
        <input id="dailyTheme" placeholder="Day 2 - You've been challenged">
        <label>Publish Date</label>
        <input id="publishDate" type="datetime-local">

        <label>Preview</label>
        <textarea id="preview"></textarea>

        <label>Content</label>
        <textarea id="content"></textarea>

        <button onclick="savePost()">Save Devotional</button>

        <hr>
        <h3>Manage Posts</h3>
        <div id="posts"></div>
    </div>

    <div id="verses" class="tab-content">
        <h2>Verse Scheduler (KJV)</h2>

        <label>Date</label>
        <input type="date" id="verseDate">

        <label>Reference</label>
        <input id="verseRef" placeholder="John 3:16">

        <button onclick="fetchVerse()">Fetch KJV Verse</button>

        <label>Verse Text</label>
        <textarea id="verseText" rows="6"></textarea>

        <button onclick="saveVerse()">Save Verse</button>

        <hr>
        <h3>Scheduled Verses</h3>
        <div id="verseList"></div>
    </div>

    <div id="team" class="tab-content">
        <h2>Team Members</h2>

        <label>Name</label>
        <input id="memberName" placeholder="Name">
        
        <label>Bio</label>
        <textarea id="memberBio" placeholder="Bio"></textarea>

        <label>Profile Picture</label>
        <input type="file" id="memberPhoto" accept="image/*" onchange="previewImage(event)">
        <img id="photoPreview" class="profile-preview" src="" alt="Preview">

        <button onclick="saveTeamMember()">Save Member</button>

        <hr>
        <h3>Team List</h3>
        <div id="teamMembers"></div>
    </div>

    <div id="readingPlans" class="tab-content">
        <h2>Reading Plans</h2>
        <div class="card">
            <div class="field">
                <label>Plan ID (no spaces)</label>
                <input id="planIdField" class="input" placeholder="e.g., gospel-salvation-grace">
            </div>
            <div class="field">
                <label>Title</label>
                <input id="planTitleField" class="input" placeholder="Plan title">
            </div>
            <div class="field">
                <label>Theme</label>
                <input id="planThemeField" class="input" placeholder="Short theme/description">
            </div>
            <div class="field">
                <label>Days (one per line: day|reading|focus)</label>
                <textarea id="planDaysField" rows="6" class="input" placeholder="1|Romans 3:9–26|Our Sin — Every person is guilty"></textarea>
            </div>
            <div style="display:flex;gap:8px">
                <button id="saveReadingPlanBtn" class="btn">Save Plan</button>
                <button id="deleteReadingPlanBtn" class="btn delete">Delete Plan</button>
                <button id="refreshReadingPlansBtn" class="btn">Refresh Plans</button>
            </div>
        </div>

        <hr>
        <h3>Existing Reading Plans (Firestore)</h3>
        <div id="readingPlansList"></div>
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    updateDoc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyA3g--TT89iLyEQ5lvwI7mBcIygrls7iCQ",
    authDomain: "daily-bread-973e9.firebaseapp.com",
    projectId: "daily-bread-973e9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let editPostId = null;
let editTeamId = null;
let base64ImageString = ""; 

/* ================= IMAGE PREVIEW UTILITY ================= */
window.previewImage = function(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            base64ImageString = e.target.result;
            const previewImg = document.getElementById("photoPreview");
            previewImg.src = base64ImageString;
            previewImg.style.display = "block";
        }
        reader.readAsDataURL(file);
    }
};

/* ================= SAFE TAB SWITCH ================= */
window.switchTab = function(tab, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    const target = document.getElementById(tab);
    if (target) target.classList.add('active');
    if (btn) btn.classList.add('active');
};

/* ================= DEVOTIONALS ================= */
window.savePost = async function() {
    const post = {
    title: document.getElementById("title").value,
    day: document.getElementById("day").value,
    monthTheme: document.getElementById("monthTheme").value,
    dailyTheme: document.getElementById("dailyTheme").value,
    scripture: document.getElementById("scripture").value,
    preview: document.getElementById("preview").value,
    content: document.getElementById("content").value,
    publishDate: document.getElementById("publishDate").value || ""
};
    if (editPostId) {
        await updateDoc(doc(db, "posts", editPostId), post);
        editPostId = null;
    } else {
        await addDoc(collection(db, "posts"), post);
    }

    document.getElementById("title").value = "";
    document.getElementById("day").value = "Sunday";
    document.getElementById("monthTheme").value = "";
    document.getElementById("dailyTheme").value = "";
    document.getElementById("scripture").value = "";
    document.getElementById("preview").value = "";
    document.getElementById("content").value = "";
    document.getElementById("publishDate").value = "";

    loadPosts();
};

window.editPost = async function(id) {
    const docRef = doc(db, "posts", id);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
        const p = docSnap.data();
        document.getElementById("title").value = p.title || "";
        document.getElementById("day").value = p.day || "Sunday";
        document.getElementById("scripture").value = p.scripture || "";
        document.getElementById("monthTheme").value = p.monthTheme || "";
        document.getElementById("dailyTheme").value = p.dailyTheme || "";
        document.getElementById("preview").value = p.preview || "";
        document.getElementById("content").value = p.content || "";
        document.getElementById("publishDate").value = p.publishDate || "";
        editPostId = id;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }
};

async function loadPosts() {
    const snap = await getDocs(collection(db, "posts"));
    const container = document.getElementById("posts");
    container.innerHTML = "";

    snap.forEach(d => {
        const p = d.data();
        container.innerHTML += `
        <div class="card">
            <b>${p.title}</b><br>
<small><b>${p.monthTheme || ""}</b></small><br>
<small>${p.dailyTheme || ""}</small><br>
${p.scripture}<br>
            <button onclick="editPost('${d.id}')">Edit</button>
            <button onclick="deletePost('${d.id}')">Delete</button>
        </div>`;
    });
}

window.deletePost = async function(id) {
    await deleteDoc(doc(db, "posts", id));
    loadPosts();
};

/* ================= VERSES (KJV SAFE) ================= */
window.fetchVerse = async function() {
    const ref = document.getElementById("verseRef").value;
    if (!ref) return alert("Enter a reference");

    const res = await fetch("https://bible-api.com/" + encodeURIComponent(ref) + "?translation=kjv");
    const data = await res.json();
    document.getElementById("verseText").value = data.text || "Verse not found";
};

window.saveVerse = async function() {
    await addDoc(collection(db, "dailyVerses"), {
        date: document.getElementById("verseDate").value,
        reference: document.getElementById("verseRef").value,
        verse: document.getElementById("verseText").value
    });

    document.getElementById("verseDate").value = "";
    document.getElementById("verseRef").value = "";
    document.getElementById("verseText").value = "";

    loadVerses();
};

async function loadVerses() {
    const snap = await getDocs(collection(db, "dailyVerses"));
    const container = document.getElementById("verseList");
    container.innerHTML = "";

    snap.forEach(d => {
        const v = d.data();
        container.innerHTML += `
        <div class="card">
            <b>${v.date || ""}</b><br>
            ${v.reference || ""}<br>
            <small>${(v.verse || "").slice(0, 120)}...</small><br>
            <button onclick="deleteVerse('${d.id}')">Delete</button>
        </div>`;
    });
}

window.deleteVerse = async function(id) {
    await deleteDoc(doc(db, "dailyVerses", id));
    loadVerses();
};

/* ================= TEAM ================= */
window.saveTeamMember = async function() {
    const memberData = {
        name: document.getElementById("memberName").value,
        bio: document.getElementById("memberBio").value,
        photo: base64ImageString 
    };

    if (editTeamId) {
        await updateDoc(doc(db, "teamMembers", editTeamId), memberData);
        editTeamId = null;
    } else {
        await addDoc(collection(db, "teamMembers"), memberData);
    }

    document.getElementById("memberName").value = "";
    document.getElementById("memberBio").value = "";
    document.getElementById("memberPhoto").value = "";
    document.getElementById("photoPreview").style.display = "none";
    base64ImageString = ""; 

    loadTeam();
};

window.editTeamMember = async function(id) {
    const docRef = doc(db, "teamMembers", id);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
        const t = docSnap.data();
        document.getElementById("memberName").value = t.name || "";
        document.getElementById("memberBio").value = t.bio || "";
        
        if(t.photo) {
            base64ImageString = t.photo;
            const previewImg = document.getElementById("photoPreview");
            previewImg.src = t.photo;
            previewImg.style.display = "block";
        } else {
            document.getElementById("photoPreview").style.display = "none";
            base64ImageString = "";
        }
        
        editTeamId = id;
    }
};

window.deleteTeamMember = async function(id) {
    await deleteDoc(doc(db, "teamMembers", id));
    loadTeam();
};

async function loadTeam() {
    const snap = await getDocs(collection(db, "teamMembers"));
    const container = document.getElementById("teamMembers");
    container.innerHTML = "";

    snap.forEach(d => {
        const t = d.data();
        const imageSrc = t.photo || "https://via.placeholder.com/80"; 
        
        container.innerHTML += `
        <div class="card team-card">
            <img class="profile-img" src="${imageSrc}" alt="Profile">
            <div>
                <b>${t.name || ""}</b><br>
                <p style="margin:5px 0;">${t.bio || ""}</p>
                <button onclick="editTeamMember('${d.id}')">Edit</button>
                <button onclick="deleteTeamMember('${d.id}')">Delete</button>
            </div>
        </div>`;
    });
}

/* ================= READING PLANS (NEW) ================= */
async function loadReadingPlans() {
    try {
        const snap = await getDocs(collection(db, 'readingPlans'));
        const plans = [];
        snap.forEach(d => {
            const data = d.data();
            data._id = d.id;
            plans.push(data);
        });
        renderReadingPlans(plans);
    } catch (e) {
        console.error('loadReadingPlans error', e);
        document.getElementById('readingPlansList').innerHTML = '<div class="card">Unable to load plans.</div>';
    }
}

function renderReadingPlans(plans) {
    const container = document.getElementById('readingPlansList');
    container.innerHTML = '';
    if (!plans || !plans.length) {
        container.innerHTML = '<div class="card">No reading plans found.</div>';
        return;
    }
    plans.forEach(p => {
        const el = document.createElement('div');
        el.className = 'card';
        el.style.marginBottom = '8px';
        el.innerHTML = `<strong>${p.title || p._id}</strong><div class="note">${p.theme || ''}</div><div style="margin-top:8px"><button class="loadPlanBtn" data-id="${p._id}">Load</button> <button class="deletePlanBtn" data-id="${p._id}">Delete</button></div>`;
        container.appendChild(el);
    });
    container.querySelectorAll('.loadPlanBtn').forEach(b => b.addEventListener('click', async (evt) => {
        const id = b.dataset.id || evt.target.dataset.id;
        const docRef = doc(db, 'readingPlans', id);
        const snap = await getDoc(docRef);
        if (snap.exists()) {
            const p = snap.data();
            document.getElementById('planIdField').value = id;
            document.getElementById('planTitleField').value = p.title || '';
            document.getElementById('planThemeField').value = p.theme || '';
            document.getElementById('planDaysField').value = (p.days || []).map(d => `${d.day}|${d.reading}|${d.focus}`).join('\n');
            // switch to readingPlans tab
            switchTab('readingPlans', document.querySelector(".tab-btn[onclick*='readingPlans']"));
        }
    }));
    container.querySelectorAll('.deletePlanBtn').forEach(b => b.addEventListener('click', async (evt) => {
        const id = b.dataset.id || evt.target.dataset.id;
        if (!confirm('Delete plan ' + id + '?')) return;
        try {
            await deleteDoc(doc(db, 'readingPlans', id));
            loadReadingPlans();
        } catch (e) { console.error(e); alert('Delete failed'); }
    }));
}

document.getElementById('saveReadingPlanBtn').addEventListener('click', async () => {
    const id = document.getElementById('planIdField').value.trim();
    if (!id) return alert('Provide plan id');
    const title = document.getElementById('planTitleField').value.trim();
    const theme = document.getElementById('planThemeField').value.trim();
    const daysText = document.getElementById('planDaysField').value.trim();
    const days = daysText.split('\n').map(l => { const parts = l.split('|'); return { day: Number(parts[0] || 0), reading: parts[1] || '', focus: parts[2] || '' }; }).filter(d => d.reading);
    try {
        await setDoc(doc(db, 'readingPlans', id), { title, theme, days });
        alert('Saved');
        loadReadingPlans();
    } catch (e) { console.error(e); alert('Save failed'); }
});

document.getElementById('deleteReadingPlanBtn').addEventListener('click', async () => {
    const id = document.getElementById('planIdField').value.trim();
    if (!id) return alert('Provide plan id to delete');
    if (!confirm('Delete plan ' + id + '?')) return;
    try { await deleteDoc(doc(db, 'readingPlans', id)); alert('Deleted'); loadReadingPlans(); } catch (e) { console.error(e); alert('Delete failed'); }
});

document.getElementById('refreshReadingPlansBtn').addEventListener('click', () => loadReadingPlans());

/* INIT */
loadPosts();
loadVerses();
loadTeam();
loadReadingPlans();

</script>

</body>
</html>
